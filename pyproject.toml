[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "capsize-activitypub"
version = "0.1.0"
description = "A small, security-conscious ActivityPub client bridge for Capsize applications."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
capsize-activitypub = "capsize_activitypub.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
